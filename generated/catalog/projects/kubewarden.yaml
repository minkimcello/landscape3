apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: Kubewarden
  description: "Kubewarden is a Policy Engine powered by WebAssembly policies. Its
    policies can be written in CEL, Rego (OPA & Gatekeeper flavours), Rust, Go,
    YAML, and others. Kubewarden simplifies Policy-As-Code by allowing policy
    authors and consumers to use their preferred tooling and stack, develop and
    test policies out of cluster. "
  links:
    - title: Homepage
      url: https://www.kubewarden.io
    - title: Crunchbase
      url: https://www.crunchbase.com/organization/cloud-native-computing-foundation
    - title: Twitter
      url: https://twitter.com/kubewarden
    - title: Slack/Discord
      url: https://kubernetes.slack.com/
  tags:
    - wasm
    - webassembly
    - webassembly
    - policy
    - policyascode
    - governance
    - softwaresupplychain
    - podsecurity
    - compliance
  annotations:
    backstage.io/source-location: $url:https://github.com/kubewarden/kubewarden-controller
spec:
  type: service
  lifecycle: production
  owner: CNCF
  accepted: 2022-06-17
  category: Provisioning
  subcategory: Security & Compliance
  status: sandbox
  logo: kubewarden.svg
  maturity:
    sandbox_date: 2022-06-17
