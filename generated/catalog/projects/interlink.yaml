apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: Interlink
  description: InterLink aims to provide an abstraction for the execution of a
    Kubernetes pod on any remote resource capable of managing a Container
    execution lifecycle thanks to the Virtual Kubelet interface. It allows you
    to extend your cloud environment anywhere by running Kubernetes workloads on
    various infrastructures, creating a seamless cloud-native experience across
    diverse environments.
  links:
    - title: Homepage
      url: https://interlink-project.dev
    - title: Crunchbase
  annotations:
    backstage.io/source-location: $url:https://github.com/interlink-hq/interLink
spec:
  type: service
  lifecycle: production
  owner: CNCF
  accepted: 2025-03-04
  category: Runtime
  subcategory: Container Runtime
  status: sandbox
  logo: interlink.svg
  maturity:
    sandbox_date: 2025-03-04
