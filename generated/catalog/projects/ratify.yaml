apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: Ratify
  description: A verification engine on Kubernetes which enables verification of
    artifact security metadata and admits for deployment only those that comply
    with policies you create.
  links:
    - title: Homepage
      url: https://ratify.dev/
    - title: Crunchbase
      url: https://www.crunchbase.com/organization/cloud-native-computing-foundation
    - title: Twitter
      url: https://twitter.com/artifact_ratify
  annotations:
    backstage.io/source-location: $url:https://github.com/ratify-project/ratify
spec:
  type: service
  lifecycle: production
  owner: CNCF
  accepted: 2024-08-30
  category: Provisioning
  subcategory: Security & Compliance
  status: sandbox
  logo: ratify.svg
  maturity:
    sandbox_date: 2024-08-30
