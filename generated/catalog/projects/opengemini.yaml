apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: openGemini
  description: openGemini is an open source distributed time series DBMS with high
    concurrency, high performance, and high scalability, focusing on the storage
    and analysis of massive observability data.
  links:
    - title: Homepage
      url: https://www.opengemini.org
    - title: Crunchbase
      url: https://www.crunchbase.com/organization/cloud-native-computing-foundation
    - title: Slack/Discord
      url: https://cloud-native.slack.com/messages/open-gemini
  annotations:
    backstage.io/source-location: $url:https://github.com/openGemini/openGemini
spec:
  type: service
  lifecycle: production
  owner: CNCF
  accepted: 2024-07-09
  category: App Definition and Development
  subcategory: Database
  status: sandbox
  logo: opengemini.svg
  maturity:
    sandbox_date: 2024-07-09
