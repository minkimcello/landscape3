apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: SpinKube
  description: Open source platform for efficiently running (containerless)
    Spin-based WebAssembly (Wasm) applications on Kubernetes.
  links:
    - title: Homepage
      url: https://www.spinkube.dev/
    - title: Crunchbase
      url: https://www.crunchbase.com/organization/cloud-native-computing-foundation
  annotations:
    backstage.io/source-location: $url:https://github.com/spinframework/spin-operator
spec:
  type: service
  lifecycle: production
  owner: CNCF
  accepted: 2025-01-21
  category: Wasm
  subcategory: Orchestration & Management
  status: sandbox
  logo: spinkube.svg
  maturity:
    sandbox_date: 2025-01-21
