apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: Kuadrant
  description: Kuadrant combines Gateway API and Istio-based gateway controllers
    to enhance application connectivity. It enables platform engineers  and
    application developers to easily connect, secure, and protect their services
    and infrastructure across multiple clusters  with policies for TLS, DNS,
    application authentication & authorization, and rate limiting.
  links:
    - title: Homepage
      url: https://kuadrant.io
    - title: Crunchbase
      url: https://www.crunchbase.com/organization/cloud-native-computing-foundation
  annotations:
    backstage.io/source-location: $url:https://github.com/kuadrant/kuadrant-operator
spec:
  type: service
  lifecycle: production
  owner: CNCF
  accepted: 2024-06-19
  category: Orchestration & Management
  subcategory: API Gateway
  status: sandbox
  logo: kuadrant.svg
  maturity:
    sandbox_date: 2024-06-19
