apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: urunc
  description: A CRI-compatible runtime for running unikernels and application
    kernels as containers.  urunc bridges the gap between unikernels and
    containerized environments, enabling seamless  integration with cloud-native
    architectures while maintaining OCI compatibility.
  links:
    - title: Homepage
      url: https://urunc.io/
    - title: Crunchbase
      url: https://www.crunchbase.com/organization/cloud-native-computing-foundation
    - title: Slack/Discord
      url: https://slack.cncf.io/
  annotations:
    backstage.io/source-location: $url:https://github.com/urunc-dev/urunc
spec:
  type: service
  lifecycle: production
  owner: CNCF
  accepted: 2025-05-22
  category: Runtime
  subcategory: Container Runtime
  status: sandbox
  logo: urunc.svg
  maturity:
    sandbox_date: 2025-05-22
