apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: composefs
  description: A project that combines Linux kernel features to provide read-only
    mountable filesystem trees stacking on top of an underlying "lower" Linux
    filesystem, particularly useful for mounting container images.
  links:
    - title: Homepage
      url: https://github.com/containers/composefs
    - title: Crunchbase
      url: https://www.crunchbase.com/organization/cloud-native-computing-foundation
  annotations:
    backstage.io/source-location: $url:https://github.com/containers/composefs
spec:
  type: service
  lifecycle: production
  owner: CNCF
  accepted: 2025-01-21
  category: Runtime
  subcategory: Container Runtime
  status: sandbox
  logo: cncf.svg
  maturity:
    sandbox_date: 2025-01-21
